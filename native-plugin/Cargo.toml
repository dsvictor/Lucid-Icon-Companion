[package]
name = "lucide-companion-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Jayanta"]
description = "Native Lucide icon browser plugin for FigCraft"
license = "MIT"

[lib]
name = "lucide_companion"
crate-type = ["cdylib"]

[dependencies]
figcraft-plugin-sdk = { path = "vendor/figcraft-plugin-sdk" }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
