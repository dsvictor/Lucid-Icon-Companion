[package]
name = "lucide-companion-plugin"
version = "0.1.0"
edition = "2024"
authors = ["Jayanta"]
description = "Native Lucide icon browser plugin for FigCraft"
license = "MIT"

[lib]
name = "lucide_companion"
crate-type = ["cdylib"]

[dependencies]
figcraft-plugin-sdk = { git = "https://github.com/storytold/figcraft", package = "figcraft-plugin-sdk" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
