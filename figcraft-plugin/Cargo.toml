[package]
name = "lucide-library-plugin"
version = "0.1.0"
edition = "2024"
authors = ["Jayanta"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

build = "build.rs"

[dependencies]
figcraft-plugin-sdk = { git = "https://github.com/storytold/figcraft", rev = "f45b261687880e56d1bad11ec82b45131e57ef8b", package = "figcraft-plugin-sdk" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
