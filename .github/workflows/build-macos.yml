name: Cross-platform checks and macOS Apple Silicon package

on:
  push:
    branches:
      - main
      - "develop/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-check:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev libdbus-1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Compile release binary
        run: cargo build --release

  macos-arm64:
    name: Package macOS Apple Silicon app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --target aarch64-apple-darwin
      - name: Compile release binary
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package app and DMG
        run: bash scripts/package-macos.sh aarch64-apple-darwin
      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lucide-Companion-macOS-arm64
          path: dist/Lucide-Companion-macOS-arm64.dmg
          if-no-files-found: error
