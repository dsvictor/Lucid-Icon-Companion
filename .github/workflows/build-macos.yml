name: macOS Apple Silicon build

on:
  push:
    branches:
      - main
      - "develop/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: |
          cargo test --target aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
      - name: Package app and DMG
        run: bash scripts/package-macos.sh aarch64-apple-darwin
      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lucide-Companion-macOS-arm64
          path: dist/Lucide-Companion-macOS-arm64.dmg
          if-no-files-found: error
